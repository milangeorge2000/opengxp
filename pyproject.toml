[project]
name = "opengxp"
version = "0.1.0"
description = "Guideline-as-code MCP servers for regulated pharma work: ICH impurity limits (Q3A-Q3D), ICH Q1E stability, CDISC CORE conformance, and a GxP audit/e-signature gateway for AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.2,<5",
    "numpy>=2.5.5",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "scipy>=1.18.1",
]

license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Milan Varghese George" }]
keywords = ["mcp", "model-context-protocol", "pharma", "ich", "cmc", "gxp", "gmp", "stability", "cdisc", "sdtm", "part-11", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
]

[project.urls]
Homepage = "https://github.com/milangeorge2000/opengxp"
Source = "https://github.com/milangeorge2000/opengxp"
Issues = "https://github.com/milangeorge2000/opengxp/issues"
Changelog = "https://github.com/milangeorge2000/opengxp/releases"

[project.scripts]
opengxp = "opengxp.server:main"
opengxp-gateway = "opengxp.gateway.cli:main"

[project.optional-dependencies]
cdisc = [
    "cdisc-rules-engine>=1.0.0; python_version < '3.13'",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "hypothesis>=6.170.15",
    "pandas>=3.1.1",
    "pytest>=9.2.0",
    "statsmodels>=0.15.0",
]
