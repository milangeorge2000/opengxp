name: Release to PyPI

# Publishes when a version tag (v*) is pushed. Uses PyPI trusted publishing (OIDC):
# no API token is stored anywhere. One-time setup on pypi.org -> "Publishing" -> add a pending publisher:
#   project: opengxp | owner: milangeorge2000 | repo: opengxp | workflow: release.yml | environment: pypi
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check tag matches package version
        run: |
          v=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != version v$v"; exit 1; }
      - name: Test
        run: uv sync --locked --python 3.12 && uv run pytest -q
      - name: Build
        run: uv build
      - name: Check metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/opengxp/
    permissions:
      id-token: write      # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
